[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "bot-trader"
version = "0.1.0"
description = "A modular synthetic research platform; no market execution adapters"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
  "duckdb>=1.2,<2", "pyarrow>=19,<24",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
bot-trader = "bot_trader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/bot_trader"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "duckdb"]
ignore_missing_imports = true
