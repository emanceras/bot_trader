[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "bot-trader"
version = "0.1.0"
description = "A modular synthetic research platform; no market execution adapters"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
  "duckdb>=1.2,<2", "pyarrow==26.0.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
bot-trader = "bot_trader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/bot_trader"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "duckdb"]
ignore_missing_imports = true

[tool.uv]
constraint-dependencies = ["alembic==1.20.0", "annotated-doc==0.0.5", "annotated-types==0.8.0", "anyio==4.15.1", "certifi==2026.10.18", "click==8.5.0", "colorama==0.4.6", "duckdb==1.5.6", "fastapi==0.148.0", "h11==0.16.0", "httpcore==1.0.9", "httpx==0.28.1", "idna==3.20", "iniconfig==2.3.1", "librt==0.16.0", "mako==1.4.3", "markupsafe==3.0.4", "mypy-extensions==1.1.0", "mypy==1.20.2", "opentelemetry-api==1.45.1", "packaging==26.3", "pathspec==1.1.1", "pluggy==1.7.0", "pydantic-core==2.50.1", "pydantic-settings==2.16.0", "pydantic==2.14.1", "pygments==2.21.0", "pytest==9.1.1", "python-dotenv==1.2.4", "ruff==0.17.1", "sqlalchemy==2.1.5", "starlette==1.9.0", "typing-extensions==4.16.0", "typing-inspection==0.4.4", "uvicorn==0.54.0"]

[tool.uv.sources]
pyarrow = { path = "/workspace/technical-admission/M/downloads/pyarrow-26.0.0-cp312-cp312-manylinux_2_28_x86_64.whl" }
